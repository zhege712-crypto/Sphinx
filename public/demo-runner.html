<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; frame-src about:; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sphinx 代码演示</title>
  <style>html,body{margin:0;height:100%;background:#fff}iframe{display:block;border:0;width:100%;height:100%;background:#fff}</style>
</head>
<body>
<script>
(() => {
  let frame, initialized = false, errors = 0;
  const report = (type, message) => parent.postMessage({ sphinxDemo: type, message }, '*');
  addEventListener('message', event => {
    if (event.source === parent && !initialized && event.data?.sphinxDemo === 'run' && typeof event.data.source === 'string' && event.data.source.length <= 100000) {
      initialized = true;
      frame = document.createElement('iframe');
      frame.setAttribute('sandbox', 'allow-scripts');
      frame.setAttribute('title', '演示内容');
      frame.setAttribute('referrerpolicy', 'no-referrer');
      // The first policy is always ours. A later user-supplied policy cannot relax it.
      const policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'";
      const bridge = "<script>addEventListener('error',e=>parent.postMessage({sphinxDemo:'error',message:String(e.message||'代码运行出错').slice(0,500)},'*'));addEventListener('unhandledrejection',e=>parent.postMessage({sphinxDemo:'error',message:String(e.reason?.message||e.reason||'异步代码运行出错').slice(0,500)},'*'));<" + "/script>";
      frame.srcdoc = '<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="' + policy + '"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html{background:#fff;color:#1f2329}body{margin:16px}svg,canvas,img{max-width:100%}</style>' + bridge + event.data.source;
      frame.addEventListener('load', () => report('loaded'));
      document.body.append(frame);
    } else if (frame && event.source === frame.contentWindow && event.data?.sphinxDemo === 'error' && errors++ < 10) {
      report('error', String(event.data.message || '代码运行出错').slice(0, 500));
    }
  });
  report('ready');
})();
</script>
</body>
</html>
