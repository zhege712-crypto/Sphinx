<script>
const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let running = !reduced.matches, speed = 1, phase = 0, previous = 0;
function label() { $('toggle').textContent = running ? '暂停动画' : '播放动画'; }
$('toggle').addEventListener('click', () => { running = !running; label(); });
$('speed').addEventListener('input', e => { speed = Number(e.target.value); $('speed-label').textContent = speed + '×'; });
reduced.addEventListener('change', e => { if (e.matches) { running = false; label(); } });
function leg(id, foot, angle, hipX) {
  const x = 421 + 29 * Math.cos(angle), y = 310 + 29 * Math.sin(angle);
  const hipY = 193, dx = x - hipX, dy = y - hipY, distance = Math.hypot(dx, dy);
  const middle = Math.sqrt(Math.max(0, 75 * 75 - distance * distance / 4));
  const kneeX = (hipX + x) / 2 + dy / distance * middle;
  const kneeY = (hipY + y) / 2 - dx / distance * middle;
  $(id).setAttribute('d', `M${hipX} ${hipY}L${kneeX} ${kneeY}L${x} ${y}`);
  $(foot).setAttribute('transform', `translate(${x} ${y})`);
}
function draw() {
  const degrees = phase * 180 / Math.PI;
  $('back-wheel').setAttribute('transform', `rotate(${degrees} 305 310)`);
  $('front-wheel').setAttribute('transform', `rotate(${degrees} 565 310)`);
  $('crank').setAttribute('transform', `rotate(${degrees} 421 310)`);
  $('road').setAttribute('transform', `translate(${-((phase * 62) % 96)} 0)`);
  $('bird').setAttribute('transform', `translate(0 ${Math.sin(phase * 2) * 1.3})`);
  leg('rear-leg', 'rear-foot', phase + Math.PI, 364);
  leg('front-leg', 'front-foot', phase, 379);
}
function tick(time) {
  const delta = previous ? Math.min((time - previous) / 1000, 0.06) : 0;
  previous = time;
  if (running) { phase = (phase + delta * 3.6 * speed) % (Math.PI * 192); draw(); }
  requestAnimationFrame(tick);
}
label(); draw(); requestAnimationFrame(tick);
</script>
